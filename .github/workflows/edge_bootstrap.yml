name: EDGE research

on:
  push:
    branches: [edge-research-20260811]
    paths-ignore:
      - 'edge_outputs/**'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-research-20260811
          fetch-depth: 1
      - name: Fetch public KXBTC15M and KXBTCPERP captures
        run: |
          rm -rf /tmp/btpred-data
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/Shad0wSeven/btpred-data.git /tmp/btpred-data
          cd /tmp/btpred-data
          git sparse-checkout set kalshi_15m_live kalshi_perp
          git checkout main
      - name: Run exploratory round and retain diagnostics
        shell: bash
        run: |
          mkdir -p edge_outputs
          set +e
          python3 edge_research/explore_fast.py > edge_outputs/explore_v1.log 2>&1
          code1=$?
          python3 edge_research/diagnose_v1.py > edge_outputs/diagnose_v1.log 2>&1
          code2=$?
          printf '{"explore_exit_code":%s,"diagnose_exit_code":%s,"commit":"%s","run_id":"%s"}\n' "$code1" "$code2" "$GITHUB_SHA" "$GITHUB_RUN_ID" > edge_outputs/explore_v1_status.json
          cat edge_outputs/explore_v1.log
          cat edge_outputs/diagnose_v1.log
          exit 0
      - name: Commit research output and diagnostics
        run: |
          git config user.name 'EDGE Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edge_outputs/explore_v1_status.json edge_outputs/explore_v1.log edge_outputs/diagnose_v1.log
          test ! -f edge_outputs/explore_v1.json || git add edge_outputs/explore_v1.json
          test ! -f edge_outputs/explore_v1.md || git add edge_outputs/explore_v1.md
          test ! -f edge_outputs/diagnose_v1.json || git add edge_outputs/diagnose_v1.json
          git diff --cached --quiet || git commit -m 'EDGE round 1 opportunity diagnostics [skip ci]'
          git push origin HEAD:edge-research-20260811
