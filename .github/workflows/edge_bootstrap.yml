name: EDGE research

on:
  push:
    branches: [edge-research-20260811]
    paths-ignore:
      - 'edge_outputs/**'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-research-20260811
          fetch-depth: 1
      - name: Run conservative denominator and dependence audit
        shell: bash
        run: |
          mkdir -p edge_outputs
          set +e
          python3 edge_research/denominator_audit.py > edge_outputs/denominator_audit.log 2>&1
          code=$?
          printf '{"denominator_audit_exit_code":%s,"commit":"%s","run_id":"%s"}\n' "$code" "$GITHUB_SHA" "$GITHUB_RUN_ID" > edge_outputs/denominator_audit_status.json
          cat edge_outputs/denominator_audit.log
          exit 0
      - name: Commit audit output and diagnostics
        run: |
          git config user.name 'EDGE Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edge_outputs/denominator_audit_status.json edge_outputs/denominator_audit.log
          test ! -f edge_outputs/denominator_audit.json || git add edge_outputs/denominator_audit.json
          git diff --cached --quiet || git commit -m 'EDGE scheduled-market denominator audit [skip ci]'
          git push origin HEAD:edge-research-20260811
