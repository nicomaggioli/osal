name: EDGE research

on:
  push:
    branches: [edge-research-20260811]
    paths-ignore:
      - 'edge_outputs/**'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-research-20260811
          fetch-depth: 1
      - name: Fetch public KXBTC15M and KXBTCPERP captures
        run: |
          rm -rf /tmp/btpred-data
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/Shad0wSeven/btpred-data.git /tmp/btpred-data
          cd /tmp/btpred-data
          git sparse-checkout set kalshi_15m_live kalshi_perp
          git checkout main
      - name: Run exploratory round 1
        run: python3 edge_research/explore_fast.py
      - name: Commit research output
        run: |
          git config user.name 'EDGE Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edge_outputs/explore_v1.json edge_outputs/explore_v1.md
          git diff --cached --quiet || git commit -m 'EDGE exploratory round 1 output [skip ci]'
          git push origin HEAD:edge-research-20260811
