name: EDGE persistent-liquidity research

on:
  push:
    branches: [edge-research-20260811]
    paths-ignore:
      - 'edge_outputs/**'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-research-20260811
          fetch-depth: 1

      - name: Fetch immutable historical KXBTC15M and BRTI captures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/btpred-data
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/Shad0wSeven/btpred-data.git /tmp/btpred-data
          cd /tmp/btpred-data
          git sparse-checkout set kalshi_15m_live kalshi_perp
          git checkout main
          git lfs pull --include='kalshi_15m_live/*.jsonl.gz,kalshi_perp/*.jsonl.gz'
          find kalshi_15m_live kalshi_perp -maxdepth 1 -type f -name '*.jsonl.gz' -printf '%p %s\n' | sort > /tmp/edge_capture_manifest.txt
          sha256sum kalshi_15m_live/*.jsonl.gz kalshi_perp/*.jsonl.gz | sort > /tmp/edge_capture_sha256.txt

      - name: Run persistent-liquidity scheduled optimization
        shell: bash
        env:
          BTPRED_ROOT: /tmp/btpred-data
        run: |
          mkdir -p edge_outputs
          set +e
          python3 edge_research/optimize_scheduled_brownian_v3.py > edge_outputs/scheduled_brownian_v3.log 2>&1
          code=$?
          cp /tmp/edge_capture_manifest.txt edge_outputs/scheduled_brownian_v3_capture_manifest.txt
          cp /tmp/edge_capture_sha256.txt edge_outputs/scheduled_brownian_v3_capture_sha256.txt
          printf '{"scheduled_brownian_v3_exit_code":%s,"commit":"%s","run_id":"%s"}\n' "$code" "$GITHUB_SHA" "$GITHUB_RUN_ID" > edge_outputs/scheduled_brownian_v3_status.json
          cat edge_outputs/scheduled_brownian_v3.log
          exit 0

      - name: Commit development output
        run: |
          git config user.name 'EDGE Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edge_outputs/scheduled_brownian_v3_status.json \
                  edge_outputs/scheduled_brownian_v3.log \
                  edge_outputs/scheduled_brownian_v3_capture_manifest.txt \
                  edge_outputs/scheduled_brownian_v3_capture_sha256.txt
          test ! -f edge_outputs/scheduled_brownian_v3.json || git add edge_outputs/scheduled_brownian_v3.json
          git diff --cached --quiet || git commit -m 'EDGE persistent-liquidity v3 output [skip ci]'
          git push origin HEAD:edge-research-20260811
