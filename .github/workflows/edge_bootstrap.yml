name: EDGE research

on:
  push:
    branches: [edge-research-20260811]
    paths-ignore:
      - 'edge_outputs/**'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-research-20260811
          fetch-depth: 1
      - name: Fetch July 26-28 continuous public history
        run: |
          rm -rf /tmp/btpred-data
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/Shad0wSeven/btpred-data.git /tmp/btpred-data
          cd /tmp/btpred-data
          git sparse-checkout set spot_1s kalshi_ticks
          git checkout main
          git lfs pull --include='spot_1s/BTCFDUSD-1s-2026-07-26.zip,spot_1s/BTCFDUSD-1s-2026-07-27.zip,spot_1s/BTCFDUSD-1s-2026-07-28.zip,kalshi_ticks/KXBTC15M-1s-2026-07-27.csv.gz,kalshi_ticks/KXBTC15M-1s-2026-07-28.csv.gz,kalshi_ticks/KXBTC15M-markets-2026-07-27_2026-07-30.csv.gz'
      - name: Run fast causal probe
        shell: bash
        run: |
          mkdir -p edge_outputs
          set +e
          python3 edge_research/continuous_spot_basis_probe.py > edge_outputs/continuous_spot_basis_probe.log 2>&1
          code=$?
          printf '{"continuous_spot_basis_probe_exit_code":%s,"commit":"%s","run_id":"%s"}\n' "$code" "$GITHUB_SHA" "$GITHUB_RUN_ID" > edge_outputs/continuous_spot_basis_probe_status.json
          cat edge_outputs/continuous_spot_basis_probe.log
          exit 0
      - name: Commit probe output
        run: |
          git config user.name 'EDGE Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edge_outputs/continuous_spot_basis_probe_status.json edge_outputs/continuous_spot_basis_probe.log
          test ! -f edge_outputs/continuous_spot_basis_probe.json || git add edge_outputs/continuous_spot_basis_probe.json
          git diff --cached --quiet || git commit -m 'EDGE continuous spot-basis causal probe output [skip ci]'
          git push origin HEAD:edge-research-20260811
